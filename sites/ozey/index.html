<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ozey — Operating system for micro &amp; small businesses</title>
    <meta name="description" content="Ozey is building the operating system for micro and small businesses in India." />
    <link rel="canonical" href="https://ozey.in/" />

    <!-- Browser & theme -->
    <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#031C35" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ozey" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Ozey — Operating system for micro &amp; small businesses" />
    <meta property="og:description" content="Ozey is building the operating system for micro and small businesses in India." />
    <meta property="og:url" content="https://ozey.in/" />
    <meta property="og:image" content="https://ozey.in/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ozey" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@ozeyindia" />
    <meta name="twitter:creator" content="@ozeyindia" />
    <meta name="twitter:title" content="Ozey — Operating system for micro &amp; small businesses" />
    <meta name="twitter:description" content="Ozey is building the operating system for micro and small businesses in India." />
    <meta name="twitter:image" content="https://ozey.in/icon-512.png" />
    <meta name="twitter:image:alt" content="Ozey" />

    <!-- Icons & manifest. No SVG icon is declared on purpose: browsers prefer
         an SVG over the .ico, and the legacy favicon.svg did not match the
         real brand mark. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data — Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ozey",
        "url": "https://ozey.in",
        "logo": "https://ozey.in/icon-512.png",
        "description": "Ozey is building the operating system for micro and small businesses in India.",
        "email": "hello@ozey.in",
        "sameAs": [
          "https://www.linkedin.com/company/ozey",
          "https://x.com/ozeyindia",
          "https://www.instagram.com/ozeyindia"
        ]
      }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
