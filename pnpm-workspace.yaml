packages:
  - 'sites/*'
  - 'workforce/functions'

allowBuilds:
  '@firebase/util': false
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: false
  unrs-resolver: false

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
